<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- Background gradient: deep navy like logo -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030c1a"/>
      <stop offset="100%" stop-color="#071a3a"/>
    </linearGradient>
    <!-- Chain color: vibrant blue like logo -->
    <linearGradient id="chain1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <!-- Chain highlight: cyan like the shiny parts in the logo -->
    <linearGradient id="chain2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect width="64" height="64" rx="14" fill="none" stroke="#1d4ed8" stroke-width="1" opacity="0.6"/>

  <!-- ══ TOP CHAIN LINK (left ring, upper) ══ -->
  <!-- Outer ring of top-left chain -->
  <path d="M20 10 C20 10, 11 10, 11 20 C11 28, 18 32, 24 28 L28 24 C32 18, 28 11, 20 10 Z"
        fill="none" stroke="url(#chain1)" stroke-width="4.5" stroke-linecap="round"
        filter="url(#glow)" opacity="0.95"/>

  <!-- ══ BOTTOM CHAIN LINK (right ring, lower) ══ -->
  <!-- Outer ring of bottom-right chain -->
  <path d="M44 54 C44 54, 53 54, 53 44 C53 36, 46 32, 40 36 L36 40 C32 46, 36 53, 44 54 Z"
        fill="none" stroke="url(#chain2)" stroke-width="4.5" stroke-linecap="round"
        filter="url(#glow)" opacity="0.95"/>

  <!-- ══ INTERLOCKING LINK CONNECTOR — top right arc ══ -->
  <path d="M36 14 C42 14, 50 20, 50 28 C50 34, 46 38, 40 38"
        fill="none" stroke="url(#chain1)" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>

  <!-- ══ INTERLOCKING LINK CONNECTOR — bottom left arc ══ -->
  <path d="M28 50 C22 50, 14 44, 14 36 C14 30, 18 26, 24 26"
        fill="none" stroke="url(#chain2)" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Specular highlight dots (mimicking the glossy paint in logo) -->
  <circle cx="16" cy="16" r="2" fill="#93c5fd" opacity="0.7"/>
  <circle cx="48" cy="48" r="2" fill="#93c5fd" opacity="0.7"/>
  <circle cx="22" cy="12" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="42" cy="52" r="1.2" fill="white" opacity="0.5"/>
</svg>
