<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" fill="none">
  <defs>
    <linearGradient id="ring-grad-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="ring-grad-b" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <filter id="glow-icon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── ICON: Two interlocking chain rings ── -->
  <!-- Background glow blob -->
  <ellipse cx="30" cy="30" rx="22" ry="20" fill="#1e40af" opacity="0.18" filter="url(#glow-soft)"/>

  <!-- Top-left ring outer -->
  <path d="M16 12 C10 12, 8 18, 8 23 C8 29, 12 33, 18 33 L22 33 C25 33, 27 30, 27 27 C27 22, 24 18, 20 16"
        stroke="url(#ring-grad-a)" stroke-width="4" stroke-linecap="round" fill="none"
        filter="url(#glow-icon)"/>
  <!-- Top-left ring inner highlight -->
  <path d="M17 16 C14 17, 12 20, 12 24 C12 27, 14 30, 17 31"
        stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Bottom-right ring outer -->
  <path d="M44 48 C50 48, 52 42, 52 37 C52 31, 48 27, 42 27 L38 27 C35 27, 33 30, 33 33 C33 38, 36 42, 40 44"
        stroke="url(#ring-grad-b)" stroke-width="4" stroke-linecap="round" fill="none"
        filter="url(#glow-icon)"/>
  <!-- Bottom-right ring inner highlight -->
  <path d="M43 44 C46 43, 48 40, 48 36 C48 33, 46 30, 43 29"
        stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Interlocking connector arcs (the part where rings link) -->
  <path d="M22 15 C27 10, 36 10, 40 15 C44 20, 44 25, 40 28"
        stroke="url(#ring-grad-a)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.95"/>
  <path d="M38 45 C33 50, 24 50, 20 45 C16 40, 16 35, 20 32"
        stroke="url(#ring-grad-b)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.95"/>

  <!-- Shine dots (mimics specular highlight in logo) -->
  <circle cx="13" cy="16" r="1.8" fill="#dbeafe" opacity="0.8"/>
  <circle cx="11" cy="20" r="1" fill="white" opacity="0.5"/>
  <circle cx="47" cy="44" r="1.8" fill="#dbeafe" opacity="0.8"/>
  <circle cx="49" cy="40" r="1" fill="white" opacity="0.5"/>

  <!-- ── TEXT: Lingkoraq ── -->
  <text x="67" y="36"
        font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif"
        font-weight="800"
        font-size="26"
        letter-spacing="-0.5"
        fill="url(#text-grad)">Lingkoraq</text>

  <!-- ── TAGLINE ── -->
  <text x="68" y="50"
        font-family="'Inter', -apple-system, sans-serif"
        font-weight="500"
        font-size="9"
        letter-spacing="1.5"
        fill="#60a5fa"
        opacity="0.75">SATU LINK, BANYAK LINK</text>
</svg>
